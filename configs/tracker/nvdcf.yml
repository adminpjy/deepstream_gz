# DeepStream 9 NvDCF accuracy-oriented configuration with NVIDIA ReIdentificationNet.
# PeopleNet may run below source FPS (for example 5 FPS on a 25 FPS stream),
# while NvDCF still receives every decoded frame. Tentative/shadow ages must
# therefore tolerate detector-skip frames or the same stationary person can be
# repeatedly terminated and recreated with new object IDs.
BaseConfig:
  minDetectorConfidence: 0.1894

TargetManagement:
  enableBboxUnClipping: 1
  preserveStreamUpdateOrder: 0
  maxTargetsPerStream: 150
  # Lower values suppress duplicate target creation when a new detector bbox
  # still overlaps an existing/shadow target.
  # Reject a new detector target when it overlaps an existing target by more
  # than this amount.  0.20 removes the lower-body fragments observed in the
  # live A/B while still allowing clearly distinct people to enter.
  minIouDiff4NewTarget: 0.2000
  minTrackerConfidence: 0.1513
  probationAge: 2
  # Keep active targets alive through short detector misses/pose changes while
  # limiting how long a stale/hijacked target can compete during crossings.
  maxShadowTrackingAge: 75
  # IMPORTANT: this must be larger than the number of detector-skipped frames
  # during tentative activation. With 5 FPS detection on 25-30 FPS input there
  # are typically 4-5 skipped frames; 1 caused repeated ID churn.
  earlyTerminationAge: 8

TrajectoryManagement:
  useUniqueID: 0
  enableReAssoc: 1
  # Keep trajectory re-association conservative in multi-person crossings.
  minMatchingScore4Overall: 0.6622
  minTrackletMatchingScore: 0.2940
  minMatchingScore4ReidSimilarity: 0.0771
  matchingScoreWeight4TrackletSimilarity: 0.7981
  matchingScoreWeight4ReidSimilarity: 0.3848
  minTrajectoryLength4Projection: 34
  prepLength4TrajectoryProjection: 58
  trajectoryProjectionLength: 33
  maxAngle4TrackletMatching: 67
  minSpeedSimilarity4TrackletMatching: 0.0574
  minBboxSizeSimilarity4TrackletMatching: 0.1013
  maxTrackletMatchingTimeSearchRange: 27
  trajectoryProjectionProcessNoiseScale: 0.0100
  trajectoryProjectionMeasurementNoiseScale: 100
  trackletSpacialSearchRegionScale: 0.0100
  reidExtractionInterval: 8

DataAssociator:
  dataAssociatorType: 0
  associationMatcherType: 1
  # The pinned DS 9.0.0 low-level library accepts this legacy placement and
  # rejects BaseConfig.checkClassMatch, despite newer online documentation.
  checkClassMatch: 1
  minMatchingScore4Overall: 0.0222
  minMatchingScore4SizeSimilarity: 0.3552
  minMatchingScore4Iou: 0.0548
  minMatchingScore4VisualSimilarity: 0.5043
  matchingScoreWeight4VisualSimilarity: 0.3951
  matchingScoreWeight4SizeSimilarity: 0.6003
  matchingScoreWeight4Iou: 0.4033
  tentativeDetectorConfidence: 0.1024
  minMatchingScore4TentativeIou: 0.2852

StateEstimator:
  stateEstimatorType: 1
  processNoiseVar4Loc: 6810.8668
  processNoiseVar4Size: 1541.8647
  processNoiseVar4Vel: 1348.4874
  measurementNoiseVar4Detector: 100.0000
  measurementNoiseVar4Tracker: 293.3238

VisualTracker:
  # Use the CUDA-compatible NvDCF implementation validated on the deployed
  # WSL/dGPU runtime; VPI visualTrackerType=2 is not used here.
  visualTrackerType: 1
  useColorNames: 1
  useHog: 1
  featureImgSizeLevel: 3
  featureFocusOffsetFactor_y: -0.1054
  filterLr: 0.0767
  filterChannelWeightsLr: 0.0339
  gaussianSigma: 0.5687

ReID:
  reidType: 2
  # Attach the per-object CPU ReID vector to NvDsObjectMeta so the conservative
  # business continuity bridge can recover abrupt NvDCF ID switches.
  outputReidTensor: 1
  batchSize: 16
  workspaceSize: 1000
  reidFeatureSize: 256
  reidHistorySize: 100
  inferDims: [3, 256, 128]
  # NvMultiObjectTracker mapping: 0=FP32, 1=FP16, 2=INT8.
  networkMode: 1
  inputOrder: 0
  colorFormat: 0
  offsets: [123.6750, 116.2800, 103.5300]
  netScaleFactor: 0.01735207
  keepAspc: 1
  useVPICropScaler: 1
  addFeatureNormalization: 1
  minVisibility4GalleryUpdate: 0.6
  onnxFile: "/workspace/models/tracker/resnet50_market1501_aicity156.onnx"
  modelEngineFile: "/workspace/models/tracker/resnet50_market1501_aicity156.onnx_b16_gpu0_fp16.engine"
