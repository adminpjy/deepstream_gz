version: 1

# Single-source local development input. When `sources` contains entries it
# takes precedence. File paths are container paths under the Compose bind mount.
source:
  type: file
  camera_id: local-file-01
  path: /workspace/videos/test2.mp4
  enabled: true
  # The shipped H.264 validation clip is 10 fps. Keep this equal to the
  # real source rate so nvinfer interval calculations preserve requested FPS.
  nominal_fps: 10.0
  latency_ms: 200
  reconnect_interval_sec: 10

# Production multi-source example (empty by default). Each entry is file/RTSP.
sources: []
# sources:
#   - camera_id: gate-01
#     type: rtsp
#     url: ${GATE_01_RTSP_URL}
#     enabled: true
#     nominal_fps: 25.0
#     latency_ms: 500
#     reconnect_interval_sec: 10
#   - camera_id: gate-02
#     type: file
#     path: /workspace/videos/test-2.mp4
#     enabled: true
#     nominal_fps: 25.0

# Analysis rates are converted to nvinfer interval values from nominal_fps.
inference:
  person_fps: 5.0
  # On a 25 FPS RTSP stream this means roughly one real SCRFD inference every
  # two frames. Recognition still consumes only real detections/landmarks.
  face_fps: 12.5
  behavior_fps: 1.0

pipeline:
  streammux:
    width: 1920
    height: 1080
    batch_timeout_us: 40000
    gpu_id: 0
    attach_system_timestamp: true
    sync_inputs: false
  tiler_width: 1920
  tiler_height: 1080

# Person is the mandatory primary GIE. This deployment uses NVIDIA PeopleNet
# deployable_quantized_onnx_v2.6.3; class IDs below come from its labels.txt.
person:
  enabled: true
  type: peoplenet
  config_file: /workspace/configs/nvinfer/person-peoplenet.txt
  unique_id: 1
  person_class_ids: [0]
  people_classes:
    person: 0
    bag: 1
    face: 2
  label: person

# Narrow pre-NvDCF guard for the repeatable test2 server-rack false proposal.
# All conditions below must match the same raw PeopleNet object; no single
# width, height, position, or confidence threshold can remove an object.
person_pretracker_guard:
  enabled: true
  max_confidence: 0.55
  max_left_ratio: 0.03
  max_top_ratio: 0.02
  min_width_ratio: 0.40
  max_width_ratio: 0.50
  min_height_ratio: 0.93
  max_right_ratio: 0.52

# Disabled means the nvinfer element is not created and its config/model is not
# opened. Enabled + missing/incompatible assets fails startup clearly.
face:
  enabled: true
  config_file: /workspace/configs/nvinfer/face.example.txt
  unique_id: 2
  person_class_ids: [0]
  label: face
  # Standard SCRFD 9-output tensors are read from NvDsInferTensorMeta on the
  # parent person object and matched to each face child. See model integration.
  landmark_source: tensor
  landmark_coordinates: absolute
  landmark_scale: 1.0
  # Must equal face.example.txt pre-cluster-threshold. Prefer recall here; final
  # evidence and AdaFace still require quality/landmark checks downstream.
  landmark_threshold: 0.30

# The business layer sees only this adapter key, never tracker implementation APIs.
tracker:
  backend: nvdcf                 # nvdcf | nvsort | deepsort
  config_file: /workspace/configs/tracker/nvdcf.yml
  library_file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  width: 960
  height: 544
  gpu_id: 0
  display_tracking_id: true
  reid_assets:
    source: nvidia/tao/reidentificationnet:deployable_v1.2
    onnx_sha256: 0e21d09278508ec835955f422a9fdd3cd59b2a6ecdef98d705f388f33cebac2b
    require_prebuilt_engine: true

# NvDCF remains the tracker of record. This business-layer bridge preserves a
# stable logical ID when NvDCF briefly fragments the same still-visible person.
# Strict body ReID remains the normal identity gate; a borderline ReID result is
# allowed only when both person geometry and a real SCRFD face are nearly
# continuous. Borderline observations never update the trusted ReID gallery.
track_continuity:
  enabled: true
  max_gap_sec: 8.0
  min_iou: 0.10
  max_center_distance_ratio: 0.75
  min_area_ratio: 0.40
  max_area_ratio: 2.50
  min_match_score: 0.55
  ambiguity_margin: 0.15
  duplicate_iou: 0.90
  duplicate_iou_with_face: 0.70
  duplicate_face_iou: 0.50
  reid_max_gap_sec: 10.0
  # Calibrated against preserved A/B/A samples: different people were around
  # 0.756-0.759, so ordinary body-ReID reconnection must stay conservative.
  reid_match_min: 0.85
  reid_update_min: 0.85
  reid_hijack_margin: 0.15
  reid_ambiguity_margin: 0.08
  fragment_min_reid: 0.82
  fragment_max_gap_sec: 0.12
  fragment_min_iou: 0.65
  fragment_min_containment: 0.85
  fragment_max_center_distance_ratio: 0.13
  fragment_min_area_ratio: 0.70
  fragment_max_area_ratio: 1.35
  # Face-backed continuity is a recovery path, not face recognition. It uses a
  # real SCRFD detection only to prove spatial continuity of the same visible
  # face while keeping body ReID above a safety floor.
  face_override_max_gap_sec: 3.0
  face_override_min_person_iou: 0.25
  face_override_min_person_containment: 0.50
  face_override_max_center_distance_ratio: 0.33
  face_override_min_area_ratio: 0.60
  face_override_max_area_ratio: 1.45
  face_override_min_face_iou: 0.85
  face_override_min_face_containment: 0.95
  face_override_max_face_center_distance_ratio: 0.05
  face_override_min_face_area_ratio: 0.85
  face_override_max_face_area_ratio: 1.20
  face_override_min_face_score: 0.70
  face_override_min_reid: 0.80
  stale_retention_sec: 30.0

face_recognition:
  enabled: true
  backend: onnxruntime           # tensorrt | onnxruntime
  model: /workspace/models/adaface_ir50.onnx
  input_name: input.1
  output_name: "730"
  embedding_size: 512
  match_threshold: 0.40
  # Use short rolling windows, then keep observing the same track. This gives
  # later clearer faces another chance instead of freezing an early poor result.
  min_candidates: 2
  max_candidates: 8
  decision_timeout_sec: 2.0
  input_width: 112
  input_height: 112
  require_landmarks: true

# behavior.<name>.enabled is the authoritative load switch. Disabled models are
# absent from the pipeline and consume no model GPU memory.
behavior:
  smoking:
    enabled: false
    config_file: /workspace/configs/nvinfer/smoking.txt
    model: /workspace/models/smoking.engine
    unique_id: 11
    labels: [smoking]
    threshold: 0.50
  eating:
    enabled: false
    config_file: /workspace/configs/nvinfer/eating.txt
    model: /workspace/models/eating.engine
    unique_id: 12
    labels: [eating]
    threshold: 0.50
  drinking:
    enabled: false
    config_file: /workspace/configs/nvinfer/drinking.txt
    model: /workspace/models/drinking.engine
    unique_id: 13
    labels: [drinking]
    threshold: 0.50
  carrying:
    enabled: false
    config_file: /workspace/configs/nvinfer/carrying.txt
    model: /workspace/models/carrying.engine
    unique_id: 14
    labels: [carrying]
    threshold: 0.50

models:
  person:
    architecture: peoplenet-resnet34-detectnet-v2
    source: nvidia/tao/peoplenet:deployable_quantized_onnx_v2.6.3
    onnx: /workspace/models/peoplenet/resnet34_peoplenet.onnx
    engine: /workspace/models/peoplenet/resnet34_peoplenet.onnx_b1_gpu0_fp16.engine
    labels: /workspace/models/peoplenet/labels.txt
    calibration: /workspace/models/peoplenet/resnet34_peoplenet_int8.txt
  tracker_reid:
    architecture: resnet50-market1501-aicity156
    source: nvidia/tao/reidentificationnet:deployable_v1.2
    onnx: /workspace/models/tracker/resnet50_market1501_aicity156.onnx
    engine: /workspace/models/tracker/resnet50_market1501_aicity156.onnx_b16_gpu0_fp16.engine
  face:
    architecture: scrfd
    onnx: /workspace/models/face-deepstream.onnx
    engine: /workspace/models/face.engine
  adaface:
    architecture: adaface-ir50-onnx
    onnx: /workspace/models/adaface_ir50.onnx
  behaviors:
    metadata_template: /workspace/configs/models/behavior.metadata.example.json

snapshot:
  enabled: true
  root: /workspace/output/snapshot
  image_format: jpg
  jpeg_quality: 95
  # Evidence is written immediately, so this value only controls lifecycle
  # cleanup. Keep state through short NvDCF shadow/re-association gaps.
  person_decision_delay_sec: 10.0
  behavior_cooldown_sec: 10.0
  max_pending_tracks: 10000

person_crop:
  # These ratios are also reused for the user-facing face alarm crop. They give
  # the face image more head/neck/shoulder context instead of a tiny detector ROI.
  padding_x_ratio: 0.35
  padding_top_ratio: 0.25
  upper_body_height_ratio: 0.85
  min_crop_width: 16
  min_crop_height: 32
  min_visible_ratio: 0.50

output:
  # Result MP4 is disabled. Live preview.jpg/MJPEG and snapshots/events remain
  # available and do not need a monolithic encoded result video.
  enabled: false
  path: /workspace/output/result.mp4
  codec: h264
  encoder: nvidia
  bitrate: 8000000
  sync: false
  events_enabled: true
  events_path: /workspace/output/events.jsonl

database:
  enabled: true
  dsn: ""
  dsn_env: DATABASE_DSN
  min_similarity: 0.40
  pool_min_size: 1
  pool_max_size: 8
  connect_timeout_sec: 5

runtime:
  strict_assets: true
  headless: true
  health_file: ${APP_HEALTH_FILE:-/tmp/deepstream-ai.ready}
  log_level: ${APP_LOG_LEVEL:-INFO}
  json_logs: false
  startup_timeout_sec: 600
  shutdown_timeout_sec: 20
  analytics_queue_size: 64
