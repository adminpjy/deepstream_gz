version: 1

# Single-source local development input. When `sources` contains entries it
# takes precedence. File paths are container paths under the Compose bind mount.
source:
  type: file
  camera_id: local-file-01
  path: /workspace/videos/test2.mp4
  enabled: true
  # Startup fallback only. Once PLAYING, the adaptive controller reads the
  # negotiated source caps and recalculates model cadence from the real FPS.
  nominal_fps: 10.0
  latency_ms: 200
  reconnect_interval_sec: 10

# Production multi-source example (empty by default). Each entry is file/RTSP.
sources: []
# sources:
#   - camera_id: gate-01
#     type: rtsp
#     url: ${GATE_01_RTSP_URL}
#     enabled: true
#     nominal_fps: 30.0       # startup fallback; auto-corrected after PLAYING
#     latency_ms: 200
#     reconnect_interval_sec: 10
#   - camera_id: gate-02
#     type: file
#     path: /workspace/videos/test-2.mp4
#     enabled: true
#     nominal_fps: 25.0

# PeopleNet and SCRFD both stay at the tracking/evidence safety floor. 5 FPS
# face sampling is intentional: pose changes can fragment NvDCF body ReID while
# a real face remains the strongest continuity cue.
inference:
  person_fps: 5.0
  face_fps: 5.0
  behavior_fps: 1.0

# Runtime inference-rate controller. GPU utilization is capacity telemetry, not
# by itself an overload signal: TensorRT is expected to run the GPU hard. The
# realtime controller now reduces PeopleNet only when queue backlog or drops
# prove that wall-clock processing is actually falling behind.
adaptive_inference:
  enabled: true
  initial_profile: normal
  monitor:
    sample_interval_sec: 2.0
    decision_window_sec: 10.0
    upgrade_stable_sec: 20.0
    change_cooldown_sec: 10.0
  load:
    gpu_low: 55
    gpu_high: 85
    gpu_critical: 92
    nvdec_low: 60
    nvdec_high: 85
    nvdec_critical: 95
    queue_low_ratio: 0.25
    queue_high_ratio: 0.60
    queue_critical_ratio: 0.85
  profiles:
    boost:
      person_fps: 8.0
      face_fps: 5.0
      behavior_fps: 1.0
    normal:
      person_fps: 5.0
      face_fps: 5.0
      behavior_fps: 1.0
    balanced:
      person_fps: 5.0
      face_fps: 5.0
      behavior_fps: 1.0
    protect:
      person_fps: 5.0
      face_fps: 5.0
      behavior_fps: 1.0
    emergency:
      person_fps: 5.0
      face_fps: 5.0
      behavior_fps: 1.0
  overload:
    # The worker emits SYSTEM_CAPACITY_EXCEEDED at this floor. Service-level
    # admission control can consume this policy when global task rejection is enabled.
    reject_new_tasks_at_floor: true

pipeline:
  streammux:
    width: 1920
    height: 1080
    batch_timeout_us: 40000
    gpu_id: 0
    attach_system_timestamp: true
    sync_inputs: false
  tiler_width: 1920
  tiler_height: 1080

# Person is the mandatory primary GIE. This deployment uses NVIDIA PeopleNet
# deployable_quantized_onnx_v2.6.3; class IDs below come from its labels.txt.
person:
  enabled: true
  type: peoplenet
  config_file: /workspace/configs/nvinfer/person-peoplenet.txt
  unique_id: 1
  person_class_ids: [0]
  people_classes:
    person: 0
    bag: 1
    face: 2
  label: person

# Narrow pre-NvDCF guard for the repeatable test2 server-rack false proposal.
# All conditions below must match the same raw PeopleNet object; no single
# width, height, position, or confidence threshold can remove an object.
person_pretracker_guard:
  enabled: true
  max_confidence: 0.55
  max_left_ratio: 0.03
  max_top_ratio: 0.02
  min_width_ratio: 0.40
  max_width_ratio: 0.50
  min_height_ratio: 0.93
  max_right_ratio: 0.52

# Keep the detector/NvDCF floor at 0.10 for crouched and partially visible real
# people, but do not immediately expose a brand-new weak target to business
# logic. A weak new logical track stays provisional until detector evidence or a
# real SCRFD face confirms it; otherwise it remains hidden as a false positive.
weak_new_track:
  enabled: true
  instant_confirm_confidence: 0.35
  sustained_confirm_confidence: 0.28
  confirm_after_sec: 0.8
  suppress_log_after_sec: 1.5
  min_detector_observations: 2
  min_width_ratio: 0.025
  min_height_ratio: 0.10
  stale_retention_sec: 30.0

# NvDCF shadow targets are emitted only as tracker miscellaneous metadata. They
# are used for a very short live-preview bridge and are never converted into
# business tracks, SCRFD/AdaFace input, snapshots, alarms, or database records.
shadow_tracking:
  enabled: true
  display_max_age_sec: 1.5

# Disabled means the nvinfer element is not created and its config/model is not
# opened. Enabled + missing/incompatible assets fails startup clearly.
face:
  enabled: true
  config_file: /workspace/configs/nvinfer/face.example.txt
  unique_id: 2
  person_class_ids: [0]
  label: face
  # Standard SCRFD 9-output tensors are read from NvDsInferTensorMeta on the
  # parent person object and matched to each face child. See model integration.
  landmark_source: tensor
  landmark_coordinates: absolute
  landmark_scale: 1.0
  # Keep tensor-landmark filtering aligned with face.example.txt.
  landmark_threshold: 0.35

# The business layer sees only this adapter key, never tracker implementation APIs.
tracker:
  backend: nvdcf                 # nvdcf | nvsort | deepsort
  config_file: /workspace/configs/tracker/nvdcf.yml
  library_file: /opt/nvidia/deepstream/deepstream/lib/libnvds_nvmultiobjecttracker.so
  width: 960
  height: 544
  gpu_id: 0
  display_tracking_id: true
  reid_assets:
    source: nvidia/tao/reidentificationnet:deployable_v1.2
    onnx_sha256: 0e21d09278508ec835955f422a9fdd3cd59b2a6ecdef98d705f388f33cebac2b
    require_prebuilt_engine: true

# NvDCF remains the tracker of record. This business-layer bridge preserves a
# stable logical ID when NvDCF briefly fragments the same still-visible person.
# Strict body ReID remains 0.85. Missing-ReID fallback is limited to one visible
# target and conservative geometry; it is never enabled as a general multi-person
# proximity merge.
track_continuity:
  enabled: true
  max_gap_sec: 12.0
  min_iou: 0.10
  max_center_distance_ratio: 0.75
  min_area_ratio: 0.40
  max_area_ratio: 2.50
  min_match_score: 0.55
  ambiguity_margin: 0.15
  duplicate_iou: 0.90
  duplicate_iou_with_face: 0.70
  duplicate_face_iou: 0.50
  reid_max_gap_sec: 12.0
  # Calibrated against preserved A/B/A samples: different people were around
  # 0.756-0.759, so ordinary body-ReID reconnection must stay conservative.
  reid_match_min: 0.85
  reid_update_min: 0.85
  reid_hijack_margin: 0.15
  reid_ambiguity_margin: 0.08
  fragment_min_reid: 0.82
  fragment_max_gap_sec: 0.12
  fragment_min_iou: 0.65
  fragment_min_containment: 0.85
  fragment_max_center_distance_ratio: 0.13
  fragment_min_area_ratio: 0.70
  fragment_max_area_ratio: 1.35
  # A new raw ID may provisionally inherit the previous logical ID only when it
  # is the sole visible target and its body geometry is strongly compatible.
  # This window covers the observed ~9 s seated-pose fragmentation while keeping
  # general two-person/crossing scenes on the strict ReID path.
  single_target_bridge:
    enabled: true
    max_gap_sec: 10.0
    min_iou: 0.20
    min_containment: 0.45
    max_center_distance_ratio: 0.40
    min_area_ratio: 0.60
    max_area_ratio: 1.70
  # Face-backed continuity is deliberately narrower than general geometry, but
  # it must tolerate normal head motion. Task 1c2 showed the same frontal person
  # at body-ReID 0.825 with person IoU ~0.63 and real-face IoU ~0.45, followed
  # by another fragment ~9 s later with real-face IoU ~0.92. Keep the global
  # body threshold at 0.85 and admit only this real-face-corroborated 0.80-0.85 band.
  face_override_max_gap_sec: 10.0
  face_override_min_person_iou: 0.50
  face_override_min_person_containment: 0.60
  face_override_max_center_distance_ratio: 0.30
  face_override_min_area_ratio: 0.55
  face_override_max_area_ratio: 1.60
  face_override_min_face_iou: 0.40
  face_override_min_face_containment: 0.55
  face_override_max_face_center_distance_ratio: 0.25
  face_override_min_face_area_ratio: 0.50
  face_override_max_face_area_ratio: 1.80
  face_override_min_face_score: 0.70
  face_override_min_reid: 0.80
  stale_retention_sec: 30.0

face_recognition:
  enabled: true
  backend: onnxruntime           # tensorrt | onnxruntime
  model: /workspace/models/adaface_ir50.onnx
  input_name: input.1
  output_name: "730"
  embedding_size: 512
  match_threshold: 0.40
  # Clear faces are compared immediately. If no clear face arrives, the best
  # real SCRFD candidate is compared after this short fallback window. Unknown
  # tracks continue collecting later faces and can be upgraded by better views.
  min_candidates: 2
  max_candidates: 8
  decision_timeout_sec: 1.5
  input_width: 112
  input_height: 112
  require_landmarks: true

# Local behavior models are converted by:
#   docker compose --profile tools run --rm model-converter
# They remain disabled in the base config. Production workers warm only models
# whose generated nvinfer config + TensorRT engine are actually present.
behavior:
  # One shared COCO YOLO11n SGIE runs only inside each person ROI. A dedicated
  # parser maps food/tableware classes to EATING and drink-container classes to
  # DRINKING. Either session switch enables this one inference element, so no
  # additional model or duplicate YOLO inference is introduced.
  eating:
    enabled: false
    config_file: /workspace/configs/nvinfer/eat-drink.txt
    model: /workspace/models/yolo11n.engine
    unique_id: 11
    labels: [eating, drinking]
    threshold: 0.50
  smoking:
    enabled: false
    config_file: /workspace/configs/nvinfer/smoking.txt
    model: /workspace/models/smoking.engine
    unique_id: 12
    labels: [smoking]
    threshold: 0.50
  carrying:
    enabled: false
    config_file: /workspace/configs/nvinfer/carrying.txt
    model: /workspace/models/carrying.engine
    unique_id: 15
    labels: [carrying]
    threshold: 0.50

models:
  person:
    architecture: peoplenet-resnet34-detectnet-v2
    source: nvidia/tao/peoplenet:deployable_quantized_onnx_v2.6.3
    onnx: /workspace/models/peoplenet/resnet34_peoplenet.onnx
    engine: /workspace/models/peoplenet/resnet34_peoplenet.onnx_b1_gpu0_fp16.engine
    labels: /workspace/models/peoplenet/labels.txt
    calibration: /workspace/models/peoplenet/resnet34_peoplenet_int8.txt
  tracker_reid:
    architecture: resnet50-market1501-aicity156
    source: nvidia/tao/reidentificationnet:deployable_v1.2
    onnx: /workspace/models/tracker/resnet50_market1501_aicity156.onnx
    engine: /workspace/models/tracker/resnet50_market1501_aicity156.onnx_b16_gpu0_fp16.engine
  face:
    architecture: scrfd
    onnx: /workspace/models/face-deepstream.onnx
    engine: /workspace/models/face.engine
  adaface:
    architecture: adaface-ir50-onnx
    onnx: /workspace/models/adaface_ir50.onnx
  behaviors:
    metadata_template: /workspace/configs/models/behavior.metadata.example.json
    local_eat_drink_onnx: /workspace/models/yolo11n.onnx
    local_eat_drink_engine: /workspace/models/yolo11n.engine
    local_smoking_checkpoint: /workspace/models/smoking.pt
    local_smoking_engine: /workspace/models/smoking.engine
    # Fire is deliberately prepared as a full-frame model. It is not wired into
    # the per-person optional SGIE chain because doing so would crop away fires
    # that are not inside a person's bounding box.
    local_fire_onnx: /workspace/models/fire.onnx
    local_fire_engine: /workspace/models/fire.engine
    local_fire_nvinfer: /workspace/configs/nvinfer/fire.txt

snapshot:
  enabled: true
  root: /workspace/output/snapshot
  image_format: jpg
  jpeg_quality: 95
  # Evidence is written immediately. Keep lifecycle state slightly longer than
  # the 12 s continuity window so a successfully bridged raw ID cannot arrive
  # after its logical evidence has already been finalized.
  person_decision_delay_sec: 13.0
  behavior_cooldown_sec: 10.0
  max_pending_tracks: 10000

person_crop:
  # These ratios are also reused for the user-facing face alarm crop. They give
  # the face image more head/neck/shoulder context instead of a tiny detector ROI.
  padding_x_ratio: 0.35
  padding_top_ratio: 0.25
  upper_body_height_ratio: 0.85
  min_crop_width: 16
  min_crop_height: 32
  min_visible_ratio: 0.50

output:
  # Result MP4 is disabled. Live preview.jpg/MJPEG and snapshots/events remain
  # available and do not need a monolithic encoded result video.
  enabled: false
  path: /workspace/output/result.mp4
  codec: h264
  encoder: nvidia
  bitrate: 8000000
  sync: false
  events_enabled: true
  events_path: /workspace/output/events.jsonl

database:
  enabled: true
  dsn: ""
  dsn_env: DATABASE_DSN
  min_similarity: 0.40
  pool_min_size: 1
  pool_max_size: 8
  connect_timeout_sec: 5

runtime:
  strict_assets: true
  headless: true
  health_file: ${APP_HEALTH_FILE:-/tmp/deepstream-ai.ready}
  log_level: ${APP_LOG_LEVEL:-INFO}
  json_logs: false
  startup_timeout_sec: 600
  shutdown_timeout_sec: 20
  analytics_queue_size: 64
