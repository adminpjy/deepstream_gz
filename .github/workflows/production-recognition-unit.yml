name: Production recognition unit checks

on:
  push:
    branches:
      - feature/production-session-multigpu
  pull_request:
    paths:
      - "src/deepstream_ai/production/**"
      - "src/deepstream_ai/domain.py"
      - "src/deepstream_ai/web/production_server.py"
      - "src/deepstream_ai/web/static/app.js"
      - "src/deepstream_ai/web/static/index.html"
      - "src/deepstream_ai/web/static/production.js"
      - "scripts/prepare-local-behavior-models.py"
      - "scripts/prepare-local-behavior-models-dynamic.py"
      - "scripts/convert-local-models.sh"
      - "configs/config.yaml"
      - "configs/nvinfer/eat-drink.txt"
      - "configs/nvinfer/eat-drink.labels.txt"
      - "configs/nvinfer/smoking.txt"
      - "native/yolo_parser/**"
      - "docker-compose.yml"
      - "docker/Dockerfile"
      - "docker/Dockerfile.sdk"
      - "pyproject.toml"
      - "tests/test_production_*.py"
      - ".github/workflows/production-recognition-unit.yml"

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and development checks
        run: python -m pip install -e ".[dev]"
      - name: Compile production Python modules and converter
        run: >-
          python -m compileall -q
          src/deepstream_ai/production
          src/deepstream_ai/domain.py
          src/deepstream_ai/web/production_server.py
          scripts/prepare-local-behavior-models.py
          scripts/prepare-local-behavior-models-dynamic.py
      - name: Ruff production changes
        run: >-
          ruff check
          src/deepstream_ai/production
          src/deepstream_ai/domain.py
          src/deepstream_ai/web/production_server.py
          scripts/prepare-local-behavior-models.py
          scripts/prepare-local-behavior-models-dynamic.py
          tests/test_production_behavior_contract.py
          tests/test_production_contracts.py
          tests/test_production_feature_gate.py
          tests/test_production_left_object.py
          tests/test_production_publishers.py
      - name: JavaScript syntax
        run: >-
          node --check src/deepstream_ai/web/static/app.js &&
          node --check src/deepstream_ai/web/static/production.js
      - name: Shell syntax
        run: bash -n scripts/convert-local-models.sh
      - name: Production unit tests
        run: >-
          pytest -q
          tests/test_production_behavior_contract.py
          tests/test_production_contracts.py
          tests/test_production_feature_gate.py
          tests/test_production_left_object.py
          tests/test_production_publishers.py
