[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepstream-ai-platform"
version = "0.1.0"
description = "Configuration-driven NVIDIA DeepStream industrial video analytics platform"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Proprietary"}
authors = [{name = "GZLT"}]
dependencies = [
  "numpy>=1.26,<2",
  "opencv-python-headless>=4.10,<4.12",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
  "psycopg[binary]>=3.1,<4",
]

[project.optional-dependencies]
onnx = ["onnxruntime-gpu>=1.18,<2"]
convert = [
  "onnx>=1.16,<2",
  "ultralytics>=8.3,<9",
]
dev = [
  "onnx>=1.16,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
deepstream-ai = "deepstream_ai.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"deepstream_ai.web" = ["static/*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
